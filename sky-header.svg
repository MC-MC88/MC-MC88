<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <!-- ==== Sky: dark zenith fading to a lighter, hazier horizon ==== -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#02040b"/>
      <stop offset="22%"  stop-color="#050d1f"/>
      <stop offset="48%"  stop-color="#08152c"/>
      <stop offset="72%"  stop-color="#0e2140"/>
      <stop offset="90%"  stop-color="#16304f"/>
      <stop offset="100%" stop-color="#1d3a5c"/>
    </linearGradient>

    <!-- Horizon airglow (atmospheric scattering) -->
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%"   stop-color="#4a7099" stop-opacity="0.32"/>
      <stop offset="45%"  stop-color="#2a4a6d" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2a4a6d" stop-opacity="0"/>
    </radialGradient>

    <!-- ==== Moon ==== -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#eaf2ff" stop-opacity="0.34"/>
      <stop offset="32%"  stop-color="#a9c2ee" stop-opacity="0.12"/>
      <stop offset="68%"  stop-color="#6d86b8" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#6d86b8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonSurface" cx="36%" cy="34%" r="74%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="38%"  stop-color="#f8f7f1"/>
      <stop offset="70%"  stop-color="#e6e4d9"/>
      <stop offset="100%" stop-color="#c4c2b7"/>
    </radialGradient>

    <!-- Limb darkening / terminator -->
    <radialGradient id="moonLimb" cx="36%" cy="34%" r="74%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="86%"  stop-color="#2a2a33" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#16161f" stop-opacity="0.40"/>
    </radialGradient>

    <!-- ==== Stars ==== -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="28%"  stop-color="#cfe0ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- ==== Meteor streak ==== -->
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#dbe9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>

    <!-- ==== Vignette ==== -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="80%">
      <stop offset="48%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- ==== Filters ==== -->
    <filter id="blurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurMd" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="craterBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <clipPath id="moonClip">
      <circle cx="950" cy="80" r="34"/>
    </clipPath>

    <style>
      /* Three brightness tiers keep the star field feeling natural rather
         than having every star pulse in unison. */
      .s1 { animation: tw1 7s   ease-in-out infinite alternate; }
      .s2 { animation: tw2 5.5s ease-in-out infinite alternate; }
      .s3 { animation: tw3 4.5s ease-in-out infinite alternate; }

      @keyframes tw1 { 0%,100% { opacity: .12 } 50% { opacity: .42 } }
      @keyframes tw2 { 0%,100% { opacity: .30 } 50% { opacity: .78 } }
      @keyframes tw3 { 0%,100% { opacity: .55 } 50% { opacity: 1   } }

      .shoot { animation: shoot 12s linear infinite; }

      @keyframes shoot {
        0%, 85% { transform: translate(0, 0);      opacity: 0; }
        87%     {                                  opacity: 1; }
        96%     {                                  opacity: .85; }
        100%    { transform: translate(380px, 0);  opacity: 0; }
      }
    </style>
  </defs>

  <!-- ================= SKY ================= -->
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>

  <!-- ============ MILKY WAY BAND =========== -->
  <g filter="url(#blurLg)">
    <ellipse cx="430" cy="72" rx="430" ry="66" fill="#7f9bd6" opacity="0.10" transform="rotate(-14 430 72)"/>
    <ellipse cx="370" cy="60" rx="250" ry="38" fill="#a8bdf0" opacity="0.11" transform="rotate(-14 370 60)"/>
    <ellipse cx="520" cy="82" rx="180" ry="24" fill="#c9d8ff" opacity="0.09" transform="rotate(-14 520 82)"/>
    <ellipse cx="710" cy="96" rx="220" ry="30" fill="#8fa8dd" opacity="0.07" transform="rotate(-12 710 96)"/>
    <!-- dark dust lane -->
    <ellipse cx="320" cy="58" rx="160" ry="11" fill="#0a0d1c" opacity="0.35" transform="rotate(-14 320 58)"/>
    <ellipse cx="560" cy="78" rx="120" ry="9"  fill="#0a0d1c" opacity="0.28" transform="rotate(-14 560 78)"/>
  </g>

  <!-- ============ HORIZON AIRGLOW ============ -->
  <rect width="100%" height="100%" fill="url(#horizonGlow)"/>

  <!-- ============ STARS ============ -->
  <g>
    <!-- dim field -->
    <circle class="s1" cx="85"  cy="68"  r=".45" fill="#ffffff" style="animation-delay:-1.2s"/>
    <circle class="s1" cx="168" cy="105" r=".55" fill="#dce9ff" style="animation-delay:-3.4s"/>
    <circle class="s1" cx="262" cy="72"  r=".4"  fill="#ffffff" style="animation-delay:-2.1s"/>
    <circle class="s1" cx="318" cy="120" r=".5"  fill="#dce9ff" style="animation-delay:-4.8s"/>
    <circle class="s1" cx="470" cy="140" r=".5"  fill="#ffffff" style="animation-delay:-.7s"/>
    <circle class="s1" cx="540" cy="190" r=".55" fill="#ffffff" style="animation-delay:-5.5s"/>
    <circle class="s1" cx="590" cy="110" r=".45" fill="#ffffff" style="animation-delay:-2.9s"/>
    <circle class="s1" cx="675" cy="88"  r=".5"  fill="#dce9ff" style="animation-delay:-1.6s"/>
    <circle class="s1" cx="748" cy="200" r=".5"  fill="#ffffff" style="animation-delay:-3.8s"/>
    <circle class="s1" cx="795" cy="148" r=".45" fill="#dce9ff" style="animation-delay:-6.2s"/>
    <circle class="s1" cx="872" cy="168" r=".55" fill="#ffeccf" style="animation-delay:-.9s"/>
    <circle class="s1" cx="1075" cy="110" r=".5" fill="#ffffff" style="animation-delay:-4.1s"/>
    <circle class="s1" cx="1160" cy="140" r=".6" fill="#dce9ff" style="animation-delay:-2.4s"/>
    <circle class="s1" cx="20"  cy="180" r=".55" fill="#ffffff" style="animation-delay:-5.9s"/>
    <circle class="s1" cx="65"  cy="240" r=".6"  fill="#dce9ff" style="animation-delay:-1.4s"/>
    <circle class="s1" cx="110" cy="205" r=".45" fill="#ffffff" style="animation-delay:-3.1s"/>
    <circle class="s1" cx="155" cy="265" r=".55" fill="#ffffff" style="animation-delay:-6.6s"/>
    <circle class="s1" cx="200" cy="230" r=".5"  fill="#ffffff" style="animation-delay:-.5s"/>
    <circle class="s1" cx="245" cy="285" r=".6"  fill="#ffeccf" style="animation-delay:-4.4s"/>
    <circle class="s1" cx="290" cy="245" r=".5"  fill="#ffffff" style="animation-delay:-2.7s"/>
    <circle class="s1" cx="335" cy="275" r=".55" fill="#ffffff" style="animation-delay:-5.2s"/>
    <circle class="s1" cx="380" cy="225" r=".45" fill="#dce9ff" style="animation-delay:-1.9s"/>
    <circle class="s1" cx="430" cy="285" r=".55" fill="#ffffff" style="animation-delay:-6.9s"/>
    <circle class="s1" cx="480" cy="240" r=".5"  fill="#ffffff" style="animation-delay:-3.6s"/>
    <circle class="s1" cx="520" cy="275" r=".5"  fill="#ffffff" style="animation-delay:-.2s"/>
    <circle class="s1" cx="570" cy="235" r=".45" fill="#ffffff" style="animation-delay:-4.9s"/>
    <circle class="s1" cx="615" cy="285" r=".55" fill="#ffeccf" style="animation-delay:-2.2s"/>
    <circle class="s1" cx="660" cy="245" r=".5"  fill="#ffffff" style="animation-delay:-5.7s"/>
    <circle class="s1" cx="710" cy="280" r=".55" fill="#ffffff" style="animation-delay:-1.1s"/>
    <circle class="s1" cx="760" cy="240" r=".45" fill="#dce9ff" style="animation-delay:-3.9s"/>
    <circle class="s1" cx="800" cy="275" r=".5"  fill="#ffffff" style="animation-delay:-6.4s"/>
    <circle class="s1" cx="850" cy="235" r=".5"  fill="#ffffff" style="animation-delay:-.8s"/>
    <circle class="s1" cx="900" cy="285" r=".5"  fill="#ffffff" style="animation-delay:-4.6s"/>
    <circle class="s1" cx="950" cy="240" r=".55" fill="#ffffff" style="animation-delay:-2.6s"/>
    <circle class="s1" cx="1000" cy="275" r=".5" fill="#ffeccf" style="animation-delay:-5.4s"/>
    <circle class="s1" cx="1050" cy="235" r=".5" fill="#ffffff" style="animation-delay:-1.7s"/>
    <circle class="s1" cx="1100" cy="285" r=".55" fill="#ffffff" style="animation-delay:-3.3s"/>
    <circle class="s1" cx="1150" cy="245" r=".5" fill="#ffffff" style="animation-delay:-6.1s"/>
    <circle class="s1" cx="75"  cy="150" r=".45" fill="#dce9ff" style="animation-delay:-.4s"/>
    <circle class="s1" cx="1030" cy="200" r=".5" fill="#ffffff" style="animation-delay:-4.3s"/>
    <circle class="s1" cx="1180" cy="190" r=".55" fill="#ffffff" style="animation-delay:-2.0s"/>

    <!-- mid field -->
    <circle class="s2" cx="40"  cy="25"  r=".7"  fill="#dce9ff" style="animation-delay:-1.5s"/>
    <circle class="s2" cx="205" cy="42"  r=".5"  fill="#ffffff" style="animation-delay:-3.7s"/>
    <circle class="s2" cx="240" cy="150" r=".7"  fill="#ffffff" style="animation-delay:-5.1s"/>
    <circle class="s2" cx="356" cy="62"  r=".6"  fill="#ffffff" style="animation-delay:-.9s"/>
    <circle class="s2" cx="392" cy="175" r=".7"  fill="#ffffff" style="animation-delay:-4.2s"/>
    <circle class="s2" cx="420" cy="95"  r=".5"  fill="#ffeccf" style="animation-delay:-2.3s"/>
    <circle class="s2" cx="505" cy="68"  r=".6"  fill="#dce9ff" style="animation-delay:-6.0s"/>
    <circle class="s2" cx="620" cy="55"  r=".55" fill="#ffeccf" style="animation-delay:-1.3s"/>
    <circle class="s2" cx="648" cy="160" r=".7"  fill="#ffffff" style="animation-delay:-3.5s"/>
    <circle class="s2" cx="725" cy="132" r=".6"  fill="#ffffff" style="animation-delay:-5.6s"/>
    <circle class="s2" cx="772" cy="62"  r=".55" fill="#ffffff" style="animation-delay:-.6s"/>
    <circle class="s2" cx="845" cy="108" r=".5"  fill="#ffffff" style="animation-delay:-4.7s"/>
    <circle class="s2" cx="895" cy="45"  r=".5"  fill="#ffffff" style="animation-delay:-2.8s"/>
    <circle class="s2" cx="1010" cy="150" r=".7" fill="#ffffff" style="animation-delay:-6.3s"/>
    <circle class="s2" cx="1040" cy="60" r=".6"  fill="#dce9ff" style="animation-delay:-1.0s"/>
    <circle class="s2" cx="1130" cy="80" r=".5"  fill="#ffffff" style="animation-delay:-3.2s"/>
    <circle class="s2" cx="1185" cy="55" r=".5"  fill="#ffffff" style="animation-delay:-5.8s"/>
    <circle class="s2" cx="25"  cy="105" r=".55" fill="#ffffff" style="animation-delay:-.3s"/>
    <circle class="s2" cx="165" cy="60"  r=".5"  fill="#ffffff" style="animation-delay:-4.5s"/>
    <circle class="s2" cx="350" cy="10"  r=".5"  fill="#ffffff" style="animation-delay:-2.5s"/>
    <circle class="s2" cx="600" cy="10"  r=".45" fill="#ffffff" style="animation-delay:-6.7s"/>
    <circle class="s2" cx="900" cy="10"  r=".5"  fill="#ffffff" style="animation-delay:-1.8s"/>

    <!-- bright stars -->
    <circle class="s3" cx="130"  cy="18" r=".9"  fill="#ffffff" style="animation-delay:-2.2s"/>
    <circle class="s3" cx="300"  cy="22" r=".8"  fill="#ffffff" style="animation-delay:-4.9s"/>
    <circle class="s3" cx="448"  cy="30" r=".9"  fill="#ffffff" style="animation-delay:-.7s"/>
    <circle class="s3" cx="700"  cy="18" r=".8"  fill="#ffffff" style="animation-delay:-3.4s"/>
    <circle class="s3" cx="1100" cy="30" r=".8"  fill="#ffffff" style="animation-delay:-5.5s"/>
  </g>

  <!-- ===== Bright star halos (static, gives the field depth) ===== -->
  <g>
    <circle cx="130"  cy="18" r="6"   fill="url(#starGlow)"/>
    <circle cx="300"  cy="22" r="5"   fill="url(#starGlow)"/>
    <circle cx="448"  cy="30" r="6"   fill="url(#starGlow)"/>
    <circle cx="700"  cy="18" r="5"   fill="url(#starGlow)"/>
    <circle cx="1100" cy="30" r="5"   fill="url(#starGlow)"/>
    <circle cx="1185" cy="55" r="4"   fill="url(#starGlow)" opacity="0.7"/>
    <circle cx="40"   cy="25" r="3.5" fill="url(#starGlow)" opacity="0.6"/>
  </g>

  <!-- ================= MOON ================= -->
  <g>
    <!-- atmospheric halo -->
    <circle cx="950" cy="80" r="180" fill="url(#moonHalo)"/>
    <circle cx="950" cy="80" r="78"  fill="url(#moonHalo)"/>

    <!-- moonlit haze on the surrounding sky -->
    <circle cx="950" cy="80" r="120" fill="url(#moonHalo)" opacity="0.5" filter="url(#blurMd)"/>

    <g clip-path="url(#moonClip)">
      <!-- base disc with limb darkening -->
      <circle cx="950" cy="80" r="34" fill="url(#moonSurface)"/>

      <g filter="url(#craterBlur)">
        <!-- maria (dark plains) -->
        <ellipse cx="942" cy="74" rx="15" ry="12" fill="#b9b7ad" opacity="0.18"/>
        <ellipse cx="962" cy="92" rx="11" ry="9"  fill="#b9b7ad" opacity="0.14"/>

        <!-- craters -->
        <ellipse cx="936" cy="70"  rx="6"   ry="5.5" fill="#b0aea3" opacity="0.40"/>
        <ellipse cx="963" cy="88"  rx="7.5" ry="6.5" fill="#b0aea3" opacity="0.32"/>
        <ellipse cx="948" cy="62"  rx="4"   ry="3.6" fill="#b8b6ab" opacity="0.30"/>
        <ellipse cx="930" cy="92"  rx="5"   ry="4.4" fill="#b0aea3" opacity="0.28"/>
        <ellipse cx="970" cy="68"  rx="3.4" ry="3"   fill="#b8b6ab" opacity="0.30"/>
        <ellipse cx="956" cy="101" rx="4.4" ry="4"   fill="#b0aea3" opacity="0.25"/>
        <ellipse cx="924" cy="79"  rx="2.8" ry="2.6" fill="#b8b6ab" opacity="0.30"/>
        <ellipse cx="944" cy="90"  rx="2.4" ry="2.2" fill="#b0aea3" opacity="0.32"/>
        <ellipse cx="975" cy="95"  rx="2.6" ry="2.4" fill="#b8b6ab" opacity="0.22"/>
        <ellipse cx="938" cy="104" rx="2.2" ry="2"   fill="#b8b6ab" opacity="0.22"/>

        <!-- subtle rim highlights on the bright side -->
        <ellipse cx="934" cy="68" rx="5" ry="4.5" fill="#ffffff" opacity="0.10"/>
        <ellipse cx="961" cy="86" rx="6" ry="5"   fill="#ffffff" opacity="0.07"/>
      </g>

      <!-- shadow curve across the disc -->
      <circle cx="950" cy="80" r="34" fill="url(#moonLimb)"/>
    </g>
  </g>

  <!-- ================= METEORS ================= -->
  <g transform="translate(180,40) rotate(22)">
    <g class="shoot" style="animation-delay:0s">
      <line x1="-115" y1="0" x2="0" y2="0" stroke="url(#streak)" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4"   fill="#ffffff" opacity="0.22"/>
      <circle cx="0" cy="0" r="1.7" fill="#ffffff"/>
    </g>
  </g>

  <g transform="translate(560,25) rotate(30)">
    <g class="shoot" style="animation-delay:-4.5s">
      <line x1="-95" y1="0" x2="0" y2="0" stroke="url(#streak)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3.2" fill="#ffffff" opacity="0.2"/>
      <circle cx="0" cy="0" r="1.4" fill="#ffffff"/>
    </g>
  </g>

  <g transform="translate(80,120) rotate(16)">
    <g class="shoot" style="animation-delay:-8s">
      <line x1="-80" y1="0" x2="0" y2="0" stroke="url(#streak)" stroke-width="1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.6" fill="#ffffff" opacity="0.18"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= VIGNETTE ================= -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
